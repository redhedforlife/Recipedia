<style>
/* The plate (nested Voronoi: region > cuisine > course > family > dish > recipe) owns the window and never moves on its own.
   The panel speaks the plate's grammar: tile glyphs sized by popularity, a specimen of the current node, squared tiles for chips. */
:root{
  --paper:#F4EFE6; --plate:#FAF7F1; --card:#FCFAF6; --ink:#1E1B16; --graphite:#665F54; --faint:#8F8677; --rule:#E2DACB; --hover:#EFE9DE; --sel:#E4D9C3; --edge:#8F8677;
  --na:#B04E27; --latam:#A0406C; --eu:#8C9A45; --mena:#93393F; --ssa:#2F4A7E; --sa:#C99A2B; --ea:#9C74B4; --sea:#1F6F74; --oce:#3E86A8;
  --wash:.2; --shadow:30,27,22;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --panel-w:408px; --ease:cubic-bezier(.16,1,.3,1); --inset:0px; --rc:var(--graphite);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15130F; --plate:#1B1814; --card:#1D1A15; --ink:#EEE7DA; --graphite:#ADA597; --faint:#7A7266; --rule:#342E26; --hover:#27231D; --sel:#3D3529; --edge:#736B5F;
  --na:#D9774A; --latam:#CF6E97; --eu:#A9B862; --mena:#C9636B; --ssa:#7F98CC; --sa:#DDB24E; --ea:#B99AD3; --sea:#4FA6A9; --oce:#6FB0CF; --wash:.3; --shadow:0,0,0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15130F; --plate:#1B1814; --card:#1D1A15; --ink:#EEE7DA; --graphite:#ADA597; --faint:#7A7266; --rule:#342E26; --hover:#27231D; --sel:#3D3529; --edge:#736B5F;
  --na:#D9774A; --latam:#CF6E97; --eu:#A9B862; --mena:#C9636B; --ssa:#7F98CC; --sa:#DDB24E; --ea:#B99AD3; --sea:#4FA6A9; --oce:#6FB0CF; --wash:.3; --shadow:0,0,0; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--sel);color:var(--ink)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}
.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);height:100%}

/* stage */
.stage{position:relative;min-width:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.pointer{cursor:pointer}
#map:active{cursor:grabbing}
#map:focus-visible{outline:2px solid var(--ink);outline-offset:-4px;border-radius:0}
.top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:20px;right:20px;display:flex;align-items:baseline;gap:18px;pointer-events:none;z-index:3}
.top>*{pointer-events:auto}
.mark{font-family:var(--serif);font-size:23px;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.crumbs{display:flex;align-items:baseline;gap:2px;font-size:13px;color:var(--graphite);min-width:0;flex-wrap:wrap}
.crumbs a,.crumbs button{background:none;border:0;padding:2px 4px;cursor:pointer;color:var(--graphite);border-radius:4px;text-decoration:none;transition:color .15s,background .15s;display:inline-flex;align-items:center;gap:4px}
.crumbs a:hover,.crumbs button:hover{color:var(--ink);background:var(--hover)}
.crumbs .sep{color:var(--faint);padding:0 1px}
.crumbs .here{color:var(--ink);font-weight:500;padding:2px 4px}
.zoom{position:absolute;right:16px;bottom:calc(16px + var(--inset) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:6px;background:var(--card);overflow:hidden;z-index:3;transition:bottom .3s var(--ease)}
.zoom button{width:34px;height:32px;display:grid;place-items:center;background:none;border:0;cursor:pointer;color:var(--graphite);transition:background .15s,color .15s}
.zoom button:hover{background:var(--hover);color:var(--ink)}
.zoom button+button{border-top:1px solid var(--rule)}
.viewsw{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top,0px));z-index:7}
.vbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:6px;background:var(--card);padding:5px 7px 5px 10px;font:500 12px var(--sans);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
.vbtn .vk{color:var(--graphite);font-weight:400}
.vbtn b{font-weight:500}
.vbtn:hover,.vbtn[aria-expanded="true"]{background:var(--hover)}
.vmenu{position:absolute;right:0;top:calc(100% + 6px);width:258px;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:4px;box-shadow:0 12px 32px rgba(var(--shadow),.16);display:flex;flex-direction:column;gap:2px}
.vmenu[hidden]{display:none}
.vmenu button[hidden],.vmenu .xp[hidden]{display:none}
.vmenu .vsep{height:1px;background:var(--rule);margin:4px 6px}
.vmenu .vhead{font:500 11px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--graphite);padding:6px 10px 2px}
.vmenu button{display:grid;grid-template-columns:20px 1fr;gap:1px 10px;text-align:left;background:none;border:0;border-radius:5px;padding:8px 10px 9px 8px;cursor:pointer;color:var(--ink);font:inherit;transition:background .15s}
.vmenu button svg{grid-row:span 2;width:20px;height:20px;margin-top:1px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;color:var(--graphite)}
.vmenu button b{font:500 13px var(--sans)}
.vmenu button span{font-size:12px;color:var(--graphite);line-height:1.35}
.vmenu button:hover,.vmenu button:focus-visible{background:var(--hover);outline:none}
.vmenu button[aria-checked="true"]{background:var(--sel)}
.vmenu button[aria-checked="true"] svg{color:var(--ink)}
body.isgal .stage{--paper:#090807;--plate:#100E0B;--card:#1D1A15;--ink:#EEE7DA;--graphite:#ADA597;--faint:#7A7266;--rule:#342E26;--hover:#27231D;--sel:#3D3529;--shadow:0,0,0;color:var(--ink);background:#090807}
body.isgal .key>span:first-child,body.isgal .key>span:nth-child(2){display:none}
body.ishome .key>span:first-child,body.ishome .key>span:nth-child(2){display:none}
.toggle svg{flex:none}
.kadd{margin-top:16px}
.kadd .filter{margin:0}
.radd{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}
.radd button,.raddf button,.mine button{font:13px var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:5px;padding:6px 11px;cursor:pointer;min-height:34px}
.radd button:hover,.raddf button:hover,.mine button:hover{border-color:var(--ink)}
.raddf{margin:10px 0 2px}
.raddf .filter{margin:4px 0 8px}
.raddf label{display:block;font-size:12px;color:var(--graphite)}
.raddf .raddm{font-size:12.5px;color:var(--graphite);margin:0 0 8px;min-height:1em}
.raddf .radda{display:flex;gap:8px}
.raddf .raddn{font-size:12px;color:var(--graphite);margin:0 0 8px}
ul.tweaks{list-style:none;margin:6px 0 4px;padding:0}
ul.tweaks li{padding:8px 0 8px 18px;position:relative;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.45}
ul.tweaks li:last-child{border-bottom:0}
ul.tweaks li::before{content:"";position:absolute;left:3px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--faint)}
ul.tweaks li .by{display:block;font-size:12px;color:var(--graphite);margin-top:2px}
.twf textarea{width:100%;box-sizing:border-box;min-height:70px;resize:vertical;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font:14px var(--sans);padding:8px 10px;margin:4px 0 6px}
.twf .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.twf .cnt{font-size:11.5px;color:var(--graphite);float:right}
.twdone{font-size:13px;color:var(--graphite);margin:8px 0 2px}
.raddf button[type=submit]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rc .mine{grid-column:1/-1;font-size:12.5px;color:var(--graphite);margin-top:6px;display:flex;align-items:center;gap:8px}
.mine button{padding:2px 8px;min-height:26px;font-size:12px}
#kres{margin-top:4px}
#kres:empty{display:none}
button.row{width:calc(100% + 12px);background:none;border:0;text-align:left;font:inherit}
button.row .rk{font-family:var(--sans)}
.chip.on{color:var(--ink)}
.chip .x{color:var(--graphite);font-size:13px;line-height:1;margin-left:1px}
.spec .toggle{margin-top:12px}
.top{padding-right:132px}
.foot{position:absolute;left:20px;right:72px;bottom:calc(16px + var(--inset) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none;z-index:3;transition:bottom .3s var(--ease)}
.foot>*{pointer-events:auto}
.coach{position:absolute;left:50%;top:calc((100% - var(--inset,0px)) / 2);transform:translate(-50%,-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 20px 14px;border-radius:14px;background:color-mix(in srgb,var(--card) 95%,transparent);border:1px solid var(--rule);color:var(--ink);box-shadow:0 12px 36px rgba(var(--shadow),.22);pointer-events:none;opacity:0;transition:opacity .45s var(--ease);max-width:240px;text-align:center}
.coach.on{opacity:1}
.coach[hidden]{display:none}
.coach p{margin:0;font:500 13.5px/1.35 var(--sans)}
.coach .cp{display:none}
.coach.touch .cm{display:none}.coach.touch .cp{display:block}
.coach .wheel{animation:cw 1.4s var(--ease) infinite}
.coach .arr{animation:ca 1.4s var(--ease) infinite}
@keyframes cw{0%,15%{transform:translateY(0);opacity:1}55%{transform:translateY(-5px);opacity:.35}100%{transform:translateY(0);opacity:1}}
@keyframes ca{0%,20%{opacity:.15;transform:translateY(3px)}55%{opacity:1;transform:translateY(0)}100%{opacity:.15;transform:translateY(3px)}}
.coach .f1{animation:cf1 1.6s var(--ease) infinite}
.coach .f2{animation:cf2 1.6s var(--ease) infinite}
@keyframes cf1{0%,12%{transform:translate(4px,-4px)}60%,80%{transform:translate(-7px,7px)}100%{transform:translate(4px,-4px)}}
@keyframes cf2{0%,12%{transform:translate(-4px,4px)}60%,80%{transform:translate(7px,-7px)}100%{transform:translate(-4px,4px)}}
@media (prefers-reduced-motion:reduce){.coach .wheel,.coach .arr,.coach .f1,.coach .f2{animation:none}}
.hint{font-size:12.5px;color:var(--graphite);transition:opacity .3s var(--ease);pointer-events:none}
.hint.gone{opacity:0}
.key{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:var(--graphite);background:color-mix(in srgb,var(--paper) 86%,transparent);border-radius:6px;padding:5px 8px 5px 6px}
.key span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.key svg{flex:none}
.key .lbl-s{display:none}
.toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--card);border-radius:4px;padding:3px 9px 3px 7px;font-size:12px;color:var(--graphite);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.toggle:hover{color:var(--ink);border-color:var(--graphite)}
.toggle[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.toggle .fn{font-weight:600;color:var(--ink);margin-left:-2px}
#fbtn.on{border-color:var(--ink);color:var(--ink)}
.sw{position:relative;display:inline-flex}
.smenu{position:absolute;left:0;bottom:calc(100% + 6px);width:230px;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:4px;box-shadow:0 12px 32px rgba(var(--shadow),.18);display:flex;flex-direction:column;gap:1px;z-index:9}
.smenu[hidden]{display:none}
.smenu .sh{font-size:11px;color:var(--graphite);padding:6px 9px 4px}
.smenu button{all:unset;cursor:pointer;padding:7px 9px;border-radius:5px;font-size:13px;color:var(--ink)}
.smenu button:hover,.smenu button:focus-visible{background:var(--hover)}
.fsheet{position:fixed;z-index:30;left:20px;bottom:calc(64px + var(--inset,0px));width:380px;max-height:min(70vh,620px);display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:10px;box-shadow:0 16px 40px rgba(var(--shadow),.22)}
.fsheet[hidden]{display:none}
.fsheet .fh{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
.fsheet .fh h3{margin:0;font:600 15px var(--sans)}
.fsheet .fh .ct{color:var(--graphite);font-size:12.5px;flex:1}
.fsheet .fh button{all:unset;cursor:pointer;font-size:12.5px;color:var(--graphite);padding:2px 4px}
.fsheet .fh button.done{color:var(--card);background:var(--ink);border-radius:5px;padding:4px 10px;font-weight:600}
.fsheet .fb{overflow:auto;padding:4px 16px 14px;overscroll-behavior:contain}
.fsheet .fsel{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 2px}
.fsheet .fg h4{margin:14px 0 6px;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--graphite)}
.fsheet .fc{display:flex;flex-wrap:wrap;gap:6px}
.fsheet .fo{all:unset;cursor:pointer;display:inline-flex;align-items:baseline;gap:5px;border:1px solid var(--rule);border-radius:999px;padding:5px 10px;font-size:13px;line-height:1.2;color:var(--ink);background:var(--card)}
.fsheet .fo i{font-style:normal;font-size:11px;color:var(--graphite)}
.fsheet .fo:hover{border-color:var(--graphite)}
.fsheet .fo[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.fsheet .fo[aria-pressed="true"] i{color:var(--card);opacity:.75}
.fsheet .fo:disabled{opacity:.35;cursor:default}
.fsheet .fmore{all:unset;cursor:pointer;font-size:12.5px;color:var(--graphite);padding:5px 4px}
.fsheet .fnote{font-size:12px;color:var(--graphite);margin:14px 0 0}
@media(max-width:760px){.fsheet{left:8px;right:8px;width:auto;bottom:8px;max-height:72vh}}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:8px 11px;max-width:270px;box-shadow:0 6px 18px rgba(var(--shadow),.12);z-index:6}
.tip b{display:block;font-weight:500;font-size:14px}
.tip span{display:block;font-size:12.5px;color:var(--graphite);margin-top:2px;line-height:1.35}
.tip em{display:block;font-style:normal;font-size:11.5px;color:var(--graphite);margin-top:5px}

/* panel */
.panel{background:var(--card);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.grab{display:none}
.psearch{position:relative;padding:14px 24px 12px;border-bottom:1px solid var(--rule)}
.psearch .i{position:absolute;left:36px;top:26px;color:var(--graphite);pointer-events:none}
.search{width:100%;box-sizing:border-box;height:38px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);caret-color:var(--ink);font:14px var(--sans);padding:0 56px 0 34px;transition:border-color .15s}
.search:focus{outline:none;border-color:var(--graphite)}
.search::placeholder{color:var(--graphite)}
.search::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search:focus ~ .kbd,.search:not(:placeholder-shown) ~ .kbd{display:none}
.kbd{position:absolute;right:34px;top:24px;font:11px var(--mono);color:var(--graphite);border:1px solid var(--rule);border-radius:4px;padding:1px 5px;pointer-events:none}
.results{position:absolute;left:24px;right:24px;top:56px;z-index:8;background:var(--card);border:1px solid var(--rule);border-radius:8px;margin:0;padding:4px;list-style:none;max-height:60vh;overflow:auto;box-shadow:0 12px 32px rgba(var(--shadow),.16)}
.results li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 10px;cursor:pointer;border-radius:5px}
.results li .n{font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results li .t{color:var(--graphite);font-size:12px;white-space:nowrap}
.results li[aria-selected="true"],.results li:hover{background:var(--hover)}
.results .note{display:block;font-size:12px;color:var(--graphite);padding:6px 10px 2px;cursor:default}
.pbody{overflow-y:auto;padding:0 24px 48px;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--rule) transparent;overscroll-behavior:contain}
.pbody::-webkit-scrollbar{width:8px}
.pbody::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px}

.spec{margin:0 -24px;padding:22px 24px 18px;background:color-mix(in srgb,var(--rc) 8%,var(--card));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:start;border-bottom:1px solid color-mix(in srgb,var(--rc) 18%,var(--rule))}
.spec .txt{min-width:0}
.spec svg.specimen{width:76px;height:76px;flex:none;margin-top:4px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--graphite);text-decoration:none;margin:0 0 8px}
.back:hover{color:var(--ink)}
h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.08;letter-spacing:-.015em;margin:0 0 8px;text-wrap:balance}
h2.sm{font-size:28px}
.meta{font-size:13px;color:var(--graphite);margin:0;line-height:1.5}
.meta b{font-weight:500;color:var(--ink)}
.nw{white-space:nowrap}
.meta a{text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--graphite) 45%,transparent)}
.meta a:hover{color:var(--ink);text-decoration-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.chip{border:1px solid color-mix(in srgb,var(--rc) 22%,var(--rule));background:color-mix(in srgb,var(--card) 70%,transparent);border-radius:4px;padding:3px 9px;font-size:12px;color:var(--graphite);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:border-color .15s,color .15s}
.chip:hover{color:var(--ink);border-color:var(--graphite)}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip .n{font-family:var(--mono);font-size:11px}
.about p{font-size:14px;line-height:1.55;color:var(--graphite);margin:0 0 10px;text-wrap:pretty}
.gloss{font-family:var(--serif);font-size:17px;line-height:1.4;margin:8px 0 0;text-wrap:pretty}
.ranks{font-size:12.5px;color:var(--graphite);margin:12px 0 0;line-height:1.6}
